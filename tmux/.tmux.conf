set -ga terminal-overrides ",xterm-256color*:Tc"
set -s escape-time 0
set-option -g default-terminal "screen-256color"

# Ring the bell if any background window rang a bell
set -g bell-action any

# Mouse support
set-window-option -g mouse on

# History limit
set-option -g history-limit 100000

# Patch for OS X pbpaste and pbcopy under tmux.
set-option -g default-command "reattach-to-user-namespace $SHELL --login"

# Keep your finger on ctrl, or don't
bind-key ^D detach-client

# Last window
bind -r ^ last-window

# Last session
bind-key Tab switch-client -l

# Create splits and vertical splits
bind-key v split-window -h -c "#{pane_current_path}"
bind-key ^V split-window -h -c "#{pane_current_path}"
bind-key s split-window -c "#{pane_current_path}"
bind-key ^S split-window -c "#{pane_current_path}"

# Pane resize in all four directions using vi bindings.
# Can use these raw but I map them to shift-ctrl-<h,j,k,l> in iTerm.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Use vi keybindings for tmux commandline input.
set -g status-keys vi

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

set-window-option -g mode-keys vi

set-option -g base-index 1

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Local config
if-shell "[ -f ~/.tmux.conf.user ]" 'source ~/.tmux.conf.user'

# Open personal todo list and other quick-access files
bind-key t split-window -h "nvim ~/todo.md"
bind-key a display-popup -w 80% -h 70% -E "claude-dashboard --interactive"
bind-key -r C-h split-window -h "nvim ~/.config/nvim/after/plugin/lsp.lua"
bind-key -r C-i split-window -h "nvim ~/ideas.md"
bind-key -r i run-shell "tmux neww tmux-cht.sh"

# COLORSCHEME: catppuccin mocha
set-option -g status "on"

# default statusbar color
set-option -g status-style bg=#1e1e2e,fg=#cdd6f4 # bg=base, fg=text

# default window title colors
set-window-option -g window-status-style bg=#89b4fa,fg=#1e1e2e # bg=blue, fg=base

# default window with an activity alert
set-window-option -g window-status-activity-style bg=#1e1e2e,fg=#a6adc8 # bg=base, fg=subtext0

# active window title colors
set-window-option -g window-status-current-style bg=#f9e2af,fg=#1e1e2e # bg=yellow, fg=base

# pane border
set-option -g pane-active-border-style fg=#f9e2af # yellow
set-option -g pane-border-style fg=#45475a # surface1

# message infos
set-option -g message-style bg=#313244,fg=#cdd6f4 # bg=surface0, fg=text

# writing commands inactive
set-option -g message-command-style bg=#313244,fg=#cdd6f4 # bg=surface0, fg=text

# pane number display
set-option -g display-panes-active-colour "#f9e2af" # yellow
set-option -g display-panes-colour "#45475a" # surface1

# clock
set-window-option -g clock-mode-colour "#89b4fa" # blue

# bell
set-window-option -g window-status-bell-style bg=#f38ba8,fg=#1e1e2e # bg=red, fg=base

## Theme settings mixed with colors (unfortunately, but there is no cleaner way)
set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "80"
set-option -g status-right-style none
set-option -g status-right-length "120"
set-window-option -g window-status-separator ""

set-option -g status-left "#[fg=#cdd6f4, bg=#45475a] #S #[fg=#45475a, bg=#1e1e2e, nobold, noitalics, nounderscore] "
set-option -g status-right "#[fg=#313244, bg=#1e1e2e, nobold, nounderscore, noitalics] #[fg=#a6adc8,bg=#313244] CPU: #{cpu_icon}#{cpu_percentage} RAM: #{ram_icon}#{ram_percentage}  %Y-%m-%d  %H:%M #[fg=#cdd6f4, bg=#313244, nobold, noitalics, nounderscore] #[fg=#1e1e2e, bg=#cdd6f4] #h "

set-window-option -g window-status-current-format "#[fg=#1e1e2e, bg=#f9e2af, nobold, noitalics, nounderscore] #[fg=#1e1e2e, bg=#f9e2af] #I  #[fg=#1e1e2e, bg=#f9e2af, bold] #W #[fg=#f9e2af, bg=#1e1e2e, nobold, noitalics, nounderscore] "
set-window-option -g window-status-format "#[fg=#1e1e2e,bg=#313244,noitalics] #[fg=#cdd6f4,bg=#313244] #I  #[fg=#cdd6f4, bg=#313244] #W #[fg=#313244, bg=#1e1e2e, noitalics] "

# Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'

# tmux-cpu configuration
set -g @cpu_low_icon "▁"
set -g @cpu_medium_icon "▃"
set -g @cpu_high_icon "▅"
set -g @cpu_percentage_format "%3.0f%%"

set -g @ram_low_icon "▁"
set -g @ram_medium_icon "▃"
set -g @ram_high_icon "▅"
set -g @ram_percentage_format "%3.0f%%"

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
